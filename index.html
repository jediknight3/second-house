<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2F6B4F">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세컨하우스">
<title>세컨하우스 건축노트</title>
<style>
/* ═══════════════════════════════════════════
   세컨하우스 건축노트 — 디자인 시스템
   ═══════════════════════════════════════════ */
:root {
  --primary:   #2F6B4F;
  --primary-l: #E8F2EC;
  --accent:    #C9772B;
  --accent-l:  #FBF0E4;
  --green:     #05A660;
  --green-l:   #E6F7EF;
  --red:       #E5484D;
  --red-l:     #FFEFEF;
  --blue:      #3182F6;
  --blue-l:    #EBF3FF;
  --yellow:    #E0A100;
  --yellow-l:  #FFF8E1;

  --bg:     #F3F2EF;
  --card:   #FFFFFF;
  --text:   #1D2320;
  --sub:    #6B736E;
  --faint:  #9AA29D;
  --border: #E6E4DF;
  --soft:   #F6F5F2;
  --radius: 14px;
  --shadow: 0 1px 4px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:   #6FBF94;
    --primary-l: #1E3329;
    --accent:    #E39A55;
    --accent-l:  #3A2A1B;
    --green:     #3DD68C;
    --green-l:   #16301F;
    --red:       #FF6B6F;
    --red-l:     #3A1C1D;
    --blue:      #6AA8FF;
    --blue-l:    #1A2838;
    --yellow:    #F2C04A;
    --yellow-l:  #352C12;
    --bg:     #121513;
    --card:   #1B1F1C;
    --text:   #ECEFED;
    --sub:    #A3ABA6;
    --faint:  #737B76;
    --border: #2C322E;
    --soft:   #222723;
    --shadow: none;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif;
  color: var(--text); font-size: 15px; -webkit-font-smoothing: antialiased; min-height: 100vh;
}
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 16px; color: var(--text); }
a { color: var(--primary); }

/* ── 레이아웃 ── */
.side { display: none; }
.main { min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
.hdr {
  position: sticky; top: 0; z-index: 50; height: 56px; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border-bottom: 1px solid var(--border);
}
.hdr-title { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
.hdr-title small { font-size: 12px; color: var(--sub); font-weight: 600; margin-left: 6px; }
.hdr-right { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--soft); color: var(--sub); font-size: 16px; display: flex; align-items: center; justify-content: center;
}
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync-dot.ok { background: var(--green); }
.sync-dot.err { background: var(--red); }
.sync-dot.busy { background: var(--yellow); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.view { max-width: 1100px; margin: 0 auto; padding: 16px; }

.bnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  display: flex; background: var(--card); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.bnav button {
  flex: 1; border: none; background: none; padding: 8px 0 7px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--faint); font-size: 11px; font-weight: 600;
}
.bnav button .ic { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .6; }
.bnav button.on { color: var(--primary); }
.bnav button.on .ic { filter: none; opacity: 1; }

.fab {
  position: fixed; right: 18px; bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 70;
  width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--primary); color: #fff; font-size: 28px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
}

@media (min-width: 1024px) {
  .side {
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; width: 220px;
    background: var(--card); border-right: 1px solid var(--border); padding: 20px 12px; gap: 4px;
  }
  .side .logo { font-size: 18px; font-weight: 900; color: var(--primary); padding: 4px 12px 18px; }
  .side button {
    border: none; background: none; text-align: left; padding: 11px 12px; border-radius: 10px;
    font-size: 15px; font-weight: 600; color: var(--sub); cursor: pointer; display: flex; gap: 10px; align-items: center;
  }
  .side button:hover { background: var(--soft); }
  .side button.on { background: var(--primary-l); color: var(--primary); }
  .side .foot { margin-top: auto; font-size: 11px; color: var(--faint); padding: 0 12px; }
  .main { margin-left: 220px; padding-bottom: 40px; }
  .bnav { display: none; }
  .fab { bottom: 28px; right: 28px; }
  .view { padding: 24px; }
}

/* ── 공통 컴포넌트 ── */
.card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 12px; }
.card-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
.card-t { font-size: 16px; font-weight: 800; }
.card-s { font-size: 13px; color: var(--sub); }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
@media (min-width: 768px) {
  .g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .md2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .md3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
}
.grid > .card { margin-bottom: 0; }
.kpi .l { font-size: 13px; color: var(--sub); font-weight: 600; }
.kpi .v { font-size: 22px; font-weight: 800; margin-top: 4px; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--faint); margin-top: 2px; }
.mt { margin-top: 12px; }
.muted { color: var(--sub); }
.faint { color: var(--faint); }
.red { color: var(--red); }
.green { color: var(--green); }
.num { font-variant-numeric: tabular-nums; }
.right { text-align: right; }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pre { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }

.btn {
  border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer;
  background: var(--soft); color: var(--text); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn.p { background: var(--primary); color: #fff; }
.btn.d { background: var(--red-l); color: var(--red); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; justify-content: center; padding: 14px; font-size: 15px; }
.btn:disabled { opacity: .5; cursor: default; }

.tabs { display: flex; gap: 4px; background: var(--card); padding: 4px; border-radius: 12px; margin-bottom: 12px; overflow-x: auto; box-shadow: var(--shadow); }
.tabs button {
  flex: 1; border: none; background: none; padding: 9px 12px; border-radius: 9px; font-size: 14px; font-weight: 700;
  color: var(--sub); cursor: pointer; white-space: nowrap;
}
.tabs button.on { background: var(--primary); color: #fff; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--border); background: var(--card); color: var(--sub); border-radius: 20px;
  padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.chip.on { background: var(--text); color: var(--card); border-color: var(--text); }

.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--soft); color: var(--sub); white-space: nowrap; }
.badge.g { background: var(--green-l); color: var(--green); }
.badge.b { background: var(--blue-l); color: var(--blue); }
.badge.y { background: var(--yellow-l); color: var(--yellow); }
.badge.r { background: var(--red-l); color: var(--red); }
.badge.a { background: var(--accent-l); color: var(--accent); }
.badge.p { background: var(--primary-l); color: var(--primary); }

.bar { height: 8px; background: var(--soft); border-radius: 6px; overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; }
.bar.lg { height: 12px; }

.list > .it {
  display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer;
}
.list > .it:last-child { border-bottom: none; }
.it .ico {
  width: 38px; height: 38px; border-radius: 10px; background: var(--soft); display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.it .t { font-size: 15px; font-weight: 700; }
.it .s { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
.it .amt { font-size: 15px; font-weight: 800; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.grp-h { font-size: 13px; font-weight: 800; color: var(--sub); margin: 18px 4px 8px; display: flex; justify-content: space-between; }
.grp-h:first-child { margin-top: 4px; }

.empty { text-align: center; padding: 36px 16px; color: var(--faint); font-size: 14px; line-height: 1.7; }
.empty .e { font-size: 36px; margin-bottom: 6px; }

.search {
  width: 100%; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
}
.filters { display: flex; gap: 8px; margin-bottom: 10px; }
.filters select { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 9px 10px; font-size: 14px; }

/* ── 사진 그리드 ── */
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
@media (min-width: 768px) { .pgrid { grid-template-columns: repeat(5, 1fr); gap: 6px; } }
@media (min-width: 1280px) { .pgrid { grid-template-columns: repeat(6, 1fr); } }
.pgrid .ph {
  position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--soft); cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 11px; color: var(--sub); text-align: center; padding: 4px;
}
.pgrid .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pgrid .ph .doc { font-size: 28px; margin-bottom: 4px; }
.pgrid .ph .tag {
  position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 4px; max-width: calc(100% - 8px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pgrid .ph .pend { position: absolute; right: 4px; top: 4px; font-size: 12px; }

/* ── 바텀시트 / 모달 ── */
.sheet-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; display: flex; align-items: flex-end; justify-content: center;
  animation: fadein .15s;
}
@keyframes fadein { from { opacity: 0; } }
.sheet {
  background: var(--card); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0;
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom)); animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: .5; } }
@media (min-width: 768px) {
  .sheet-bg { align-items: center; }
  .sheet { border-radius: 20px; padding-bottom: 24px; }
}
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 4px auto 12px; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 8px; }
.sheet-h h3 { font-size: 19px; font-weight: 800; }
.fld { margin-bottom: 14px; }
.fld label { display: block; font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 6px; }
.fld label .req { color: var(--red); }
.fld input, .fld select, .fld textarea {
  width: 100%; border: 1px solid var(--border); background: var(--soft); border-radius: 10px; padding: 11px 12px; outline: none;
}
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--primary); background: var(--card); }
.fld textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.fld .hint { font-size: 12px; color: var(--faint); margin-top: 4px; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet-btns { display: flex; gap: 8px; margin-top: 18px; }
.sheet-btns .btn { flex: 1; justify-content: center; padding: 14px; }

.dl { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; font-size: 14px; }
.dl dt { color: var(--sub); font-weight: 600; }
.dl dd { word-break: break-word; }
.sec-t { font-size: 14px; font-weight: 800; margin: 18px 0 8px; }
.box { background: var(--soft); border-radius: 10px; padding: 12px; font-size: 14px; }

.quick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.quick button {
  border: 1px solid var(--border); background: var(--soft); border-radius: 14px; padding: 18px 12px; cursor: pointer;
  font-size: 14px; font-weight: 700; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.quick button span { font-size: 26px; }

/* ── 라이트박스 ── */
.lb { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.94); display: flex; flex-direction: column; }
.lb-top, .lb-bot { color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lb-top { padding-top: calc(12px + env(safe-area-inset-top)); }
.lb-bot { padding-bottom: calc(14px + env(safe-area-inset-bottom)); flex-direction: column; align-items: stretch; }
.lb-img { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; }
.lb-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb button { background: rgba(255,255,255,.15); color: #fff; border: none; border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
.lb .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 22px; padding: 14px 12px; }
.lb .nav.l { left: 8px; } .lb .nav.r { right: 8px; }
.lb .cap { font-size: 14px; line-height: 1.5; }
.lb .meta { font-size: 12px; opacity: .7; }

/* ── 차트 ── */
.donut-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.donut { width: 150px; height: 150px; border-radius: 50%; position: relative; flex-shrink: 0; }
.donut::after { content: ''; position: absolute; inset: 26px; background: var(--card); border-radius: 50%; }
.donut .c { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--sub); }
.donut .c b { font-size: 16px; color: var(--text); }
.legend { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.legend .li { display: flex; align-items: center; gap: 8px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.vbars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 16px; }
.vbars .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.vbars .col i { width: 100%; max-width: 34px; background: var(--primary); border-radius: 5px 5px 0 0; min-height: 2px; position: relative; }
.vbars .col i.pl { background: var(--primary-l); }
.vbars .col .v { font-size: 10px; color: var(--sub); margin-bottom: 3px; white-space: nowrap; }
.vbars .col .x { font-size: 11px; color: var(--sub); margin-top: 5px; }

/* 간트 */
.gantt { position: relative; margin-top: 8px; }
.gantt .gr { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; height: 30px; }
.gantt .gn { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gantt .gt { position: relative; height: 16px; background: var(--soft); border-radius: 4px; }
.gantt .gb { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--faint); overflow: hidden; }
.gantt .gb > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--primary); }
.gantt .today { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--red); z-index: 1; }
.gantt .gx { display: grid; grid-template-columns: 110px 1fr; gap: 8px; font-size: 11px; color: var(--faint); margin-top: 4px; }

.check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--card); color: #fff; font-size: 13px; }
.check.on { background: var(--green); border-color: var(--green); }
.done-t { text-decoration: line-through; color: var(--faint); }

.hero {
  background: linear-gradient(135deg, #2F6B4F, #4E8A68); color: #fff; border-radius: var(--radius); padding: 20px; margin-bottom: 12px;
}
.hero .n { font-size: 20px; font-weight: 800; }
.hero .a { font-size: 13px; opacity: .85; margin-top: 2px; }
.hero .dd { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
.hero .dd div { font-size: 12px; opacity: .85; }
.hero .dd b { display: block; font-size: 20px; opacity: 1; margin-top: 2px; }
.hero .bar { background: rgba(255,255,255,.25); margin-top: 14px; }
.hero .bar > i { background: #fff; }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 400;
  background: #1D2320; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 14px; font-weight: 600;
  max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.25); animation: fadein .2s;
}
.toast.err { background: var(--red); }

.upl-prev { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
.upl-prev div { aspect-ratio: 1; border-radius: 8px; background: var(--soft) center/cover; display: flex; align-items: center; justify-content: center; font-size: 11px; text-align: center; padding: 4px; color: var(--sub); overflow: hidden; }
.pick { border: 2px dashed var(--border); border-radius: 14px; padding: 22px; text-align: center; cursor: pointer; color: var(--sub); font-weight: 600; margin-bottom: 14px; }
.pick span { font-size: 30px; display: block; margin-bottom: 4px; }

table.tb { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tb th { text-align: left; font-size: 12px; color: var(--sub); font-weight: 700; padding: 8px 6px; border-bottom: 1px solid var(--border); }
table.tb td { padding: 10px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.tb tr:last-child td { border-bottom: none; }
table.tb tr.click { cursor: pointer; }
.tb-wrap { overflow-x: auto; }
</style>
</head>
<body>

<aside class="side" id="side"></aside>
<div class="main">
  <header class="hdr">
    <div class="hdr-title" id="hdrTitle">세컨하우스</div>
    <div class="hdr-right">
      <button class="icon-btn" onclick="sync(true)" title="동기화"><span class="sync-dot" id="syncDot"></span></button>
      <button class="icon-btn" onclick="go('settings')" title="설정">⚙️</button>
    </div>
  </header>
  <div class="view" id="view"></div>
</div>
<nav class="bnav" id="bnav"></nav>
<button class="fab" onclick="openQuick()" aria-label="추가">＋</button>
<div id="layer"></div>
<input type="file" id="filePick" multiple accept="image/*,application/pdf,.pdf,.dwg,.hwp,.xlsx,.xls,.doc,.docx" hidden>
<input type="file" id="importPick" accept="application/json,.json" hidden>

<script>
'use strict';
const APP_VER = '1.0.0';

/* ═══════════════════ 상수 ═══════════════════ */

/* ═══════════════════ 저장소 (IndexedDB) ═══════════════════ */
const IDB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('secondhouse', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return res(undefined);
      const t = this.db.transaction('kv', mode);
      const st = t.objectStore('kv');
      const r = fn(st);
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => rej(t.error);
    });
  },
  get(k) { return this.tx('readonly', st => st.get(k)); },
  set(k, v) { return this.tx('readwrite', st => st.put(v, k)); },
  del(k) { return this.tx('readwrite', st => st.delete(k)); },
  clear() { return this.tx('readwrite', st => st.clear()); },
};

async function persist() {
  try { await IDB.set('state', { DB, PENDING, CFG }); }
  catch (e) { console.warn('persist failed', e); }
}
async function loadState() {
  await IDB.open();
  let st;
  try { st = await IDB.get('state'); } catch (e) {}
  if (st) {
    COLS.forEach(c => DB[c] = Array.isArray(st.DB && st.DB[c]) ? st.DB[c] : []);
    PENDING = st.PENDING || [];
    CFG = Object.assign(CFG, st.CFG || {});
  }
  try { const p = localStorage.getItem('sh_page'); if (p) S.page = p; } catch (e) {}
}

const num = v => { const n = Number(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; };

function norm(col, r) {
  (F[col] || []).forEach(f => {
    if ((f.t === 'money' || f.t === 'number') && r[f.k] !== undefined && r[f.k] !== '') r[f.k] = num(r[f.k]);
  });
  if (col === 'file') r.local = r.local === true || r.local === 'true' || r.local === 1 || r.local === '1' ? 1 : 0;
  return r;
}

function upsert(col, rec) {
  rec.id = rec.id || uid();
  rec.updated = new Date().toISOString();
  if (!rec.created) rec.created = rec.updated;
  const i = DB[col].findIndex(r => r.id === rec.id);
  if (i >= 0) DB[col][i] = rec; else DB[col].push(rec);
  PENDING.push({ op: 'upsert', col, rec });
  persist();
  scheduleFlush();
  return rec;
}
function removeRec(col, id) {
  DB[col] = DB[col].filter(r => r.id !== id);
  PENDING.push({ op: 'delete', col, id });
  if (col === 'file') IDB.del('blob:' + id).catch(() => {});
  persist();
  scheduleFlush();
}

function cats() {
  const s = new Set(CATS);
  DB.budget.forEach(b => b.category && s.add(b.category));
  DB.expense.forEach(e => e.category && s.add(e.category));
  return [...s];
}
function refOpts(ref) {
  if (ref === 'vendor') return [...DB.vendor].sort((a,b) => (a.name||'').localeCompare(b.name||'')).map(v => [v.id, v.name + (v.field ? ' · ' + v.field : '')]);
  if (ref === 'phase') return sortedPhases().map(p => [p.id, p.name]);
  if (ref === 'meeting') return [...DB.meeting].sort((a,b) => (b.date||'').localeCompare(a.date||'')).map(m => [m.id, (m.date||'') + ' ' + (m.title||'')]);
  return [];
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtN = n => Math.round(num(n)).toLocaleString('ko-KR');
function fmtW(n) {
  n = num(n); const a = Math.abs(n), sg = n < 0 ? '-' : '';
  if (a >= 1e8) {
    const eok = Math.floor(a / 1e8), man = Math.round((a % 1e8) / 1e4);
    return sg + eok + '억' + (man ? ' ' + man.toLocaleString('ko-KR') + '만' : '');
  }
  if (a >= 1e4) return sg + Math.round(a / 1e4).toLocaleString('ko-KR') + '만';
  return sg + Math.round(a).toLocaleString('ko-KR') + '원';
}
const fmtD = d => { if (!d) return ''; const [y,m,dd] = String(d).split('-'); return y && m && dd ? `${y}.${m}.${dd}` : String(d); };
const fmtMD = d => { if (!d) return ''; const p = String(d).split('-'); return p.length === 3 ? `${+p[1]}/${+p[2]}` : String(d); };
const dow = d => { const x = new Date(d + 'T00:00:00'); return isNaN(x) ? '' : '일월화수목금토'[x.getDay()]; };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0;

/* ═══════════════════ 계산 ═══════════════════ */
function costTotals() {
  let paid = 0, planned = 0;
  DB.expense.forEach(e => { if (e.status === '지급예정') planned += num(e.amount); else paid += num(e.amount); });
  const catBudget = DB.budget.reduce((s, b) => s + num(b.amount), 0);
  const budget = num(proj().totalBudget) || catBudget;
  return { paid, planned, total: paid + planned, budget, catBudget, remain: budget - paid - planned };
}
function byCategory() {
  const m = {};
  cats().forEach(c => m[c] = { cat: c, budget: 0, paid: 0, planned: 0 });
  DB.budget.forEach(b => { const c = b.category || '기타'; (m[c] = m[c] || { cat: c, budget: 0, paid: 0, planned: 0 }).budget += num(b.amount); });
  DB.expense.forEach(e => { const c = e.category || '기타'; const o = (m[c] = m[c] || { cat: c, budget: 0, paid: 0, planned: 0 }); if (e.status === '지급예정') o.planned += num(e.amount); else o.paid += num(e.amount); });
  return Object.values(m).filter(o => o.budget || o.paid || o.planned);
}
function phaseProgress() {
  const ps = DB.phase.filter(p => p.status !== '보류');
  if (!ps.length) return 0;
  return ps.reduce((s, p) => s + (p.status === '완료' ? 100 : Math.max(0, Math.min(100, num(p.progress)))), 0) / ps.length;
}
const vendorPaid = id => DB.expense.filter(e => e.vendorId === id).reduce((s, e) => s + (e.status === '지급예정' ? 0 : num(e.amount)), 0);
const vendorPlanned = id => DB.expense.filter(e => e.vendorId === id && e.status === '지급예정').reduce((s, e) => s + num(e.amount), 0);
const filesOf = (type, id) => DB.file.filter(f => (f.linkType === type && f.linkId === id) || (type === 'phase' && f.phaseId === id) || (type === 'vendor' && f.vendorId === id));

  DB.expense.forEach(e => { if (e.status === '지급예정' && e.date) up.push({ d: e.date, ic: '💸', t: e.title, s: '지급예정 ' + fmtW(e.amount), on: `openExpense('${e.id}')`, over: e.date < td }); });
  DB.phase.forEach(p2 => { if (p2.start && p2.start >= td && p2.status === '예정') up.push({ d: p2.start, ic: '🏗️', t: p2.name + ' 시작', s: '공정', on: `openPhase('${p2.id}')` }); });

  // 공정

    (ph.length ? (active.length ? active : ph.slice(0, 1)).concat(next && !active.includes(next) ? [next] : []).slice(0, 4).map(x => phaseRow(x)).join('') : `<div class="empty">공정이 없어요<br><button class="btn sm p mt" onclick="event.stopPropagation();loadPhaseTemplate()">기본 공정 불러오기</button></div>`) +
    `</div>`;

  // 최근 사진

  DB.meeting.forEach(m => feed.push({ u: m.updated, ic: '📝', t: m.title, s: `미팅 · ${fmtD(m.date)}`, on: `openMeeting('${m.id}')` }));
  DB.todo.forEach(x => feed.push({ u: x.updated, ic: x.status === '완료' ? '☑️' : '✅', t: x.title, s: `할일 · ${x.status}`, on: `openForm('todo','${x.id}')` }));
  DB.vendor.forEach(v => feed.push({ u: v.updated, ic: '🤝', t: v.name, s: `업체 · ${v.status || ''}`, on: `openVendor('${v.id}')` }));
  const fileByDay = {};
  DB.file.forEach(f => { const k = (f.updated || '').slice(0, 10) + '|' + (f.kind || ''); (fileByDay[k] = fileByDay[k] || []).push(f); });
  Object.values(fileByDay).forEach(fs => feed.push({ u: fs[0].updated, ic: '📷', t: `${fs[0].kind || '자료'} ${fs.length}개 추가`, s: fs[0].caption || '', on: `go('photo')` }));
  feed.sort((a, b) => (b.u || '').localeCompare(a.u || ''));
  if (feed.length) h += `<div class="card"><div class="card-h"><div class="card-t">🕘 최근 기록</div></div><div class="list">${feed.slice(0, 8).map(f => `<div class="it" onclick="${f.on}"><div class="ico">${f.ic}</div><div class="grow"><div class="t ellipsis">${esc(f.t)}</div><div class="s ellipsis">${esc(f.s)}</div></div><div class="faint" style="font-size:12px">${relTime(f.u)}</div></div>`).join('')}</div></div>`;
  return h;
}
function floorPy() { const a = num(proj().floorArea); return a > 0 ? a / PY : 0; }
function ddayLabel(d) { const n = daysBetween(today(), d); return n === 0 ? '오늘' : n > 0 ? 'D-' + n : (-n) + '일 지남'; }
function relTime(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  if (s < 86400 * 7) return Math.floor(s / 86400) + '일 전';
  return fmtMD(iso.slice(0, 10));
}
function phaseRow(x) {
  const pr = x.status === '완료' ? 100 : Math.max(0, Math.min(100, num(x.progress)));
  return `<div style="margin-bottom:12px"><div class="between" style="margin-bottom:6px"><div class="row"><b style="font-size:14px">${esc(x.name)}</b>${phaseBadge(x.status)}</div><span class="card-s num">${pr.toFixed(0)}%</span></div>
    <div class="bar"><i style="width:${pr}%;background:${x.status === '완료' ? 'var(--green)' : 'var(--primary)'}"></i></div>
    ${x.start || x.end ? `<div class="faint" style="font-size:12px;margin-top:4px">${fmtD(x.start)} ~ ${fmtD(x.end)}</div>` : ''}</div>`;
}
const phaseBadge = s => `<span class="badge ${{ '진행중': 'b', '완료': 'g', '보류': 'r' }[s] || ''}">${esc(s || '예정')}</span>`;
const vendorBadge = s => `<span class="badge ${{ '계약': 'p', '진행중': 'b', '완료': 'g', '견적받음': 'a', '보류': 'r' }[s] || ''}">${esc(s || '검토중')}</span>`;

function vBudget() {

}

function vAnalysis() {
  if (!DB.expense.length) return `<div class="card"><div class="empty"><div class="e">📈</div>지출을 기록하면 분석이 표시돼요</div></div>`;
  let h = '';
  // 분류별 도넛
  const rows = byCategory().map(r => ({ l: r.cat, v: r.paid + r.planned })).filter(r => r.v > 0).sort((a, b) => b.v - a.v);
  const top = rows.slice(0, 8), rest = rows.slice(8).reduce((s, r) => s + r.v, 0);
  if (rest) top.push({ l: '기타 분류', v: rest });
  const total = top.reduce((s, r) => s + r.v, 0);
  let acc = 0;
  const grad = top.map((r, i) => { const a = acc; acc += r.v / total * 100; return `${PALETTE[i % PALETTE.length]} ${a}% ${acc}%`; }).join(',');
  h += `<div class="card"><div class="card-t" style="margin-bottom:14px">분류별 비용 (지급+예정)</div><div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${grad})"><div class="c">합계<b>${fmtW(total)}</b></div></div>
    <div class="legend">${top.map((r, i) => `<div class="li"><span class="sw" style="background:${PALETTE[i % PALETTE.length]}"></span><span class="grow ellipsis">${esc(r.l)}</span><b class="num">${fmtW(r.v)}</b><span class="faint num" style="width:42px;text-align:right">${(r.v / total * 100).toFixed(1)}%</span></div>`).join('')}</div>
  </div></div>`;

  // 월별
  const months = {};
  DB.expense.forEach(e => { if (!e.date) return; const k = e.date.slice(0, 7); const o = (months[k] = months[k] || { p: 0, pl: 0 }); if (e.status === '지급예정') o.pl += num(e.amount); else o.p += num(e.amount); });
  const mk = Object.keys(months).sort().slice(-12);
  const mx = Math.max(...mk.map(k => months[k].p + months[k].pl), 1);
  let cum = 0;
  const cumTxt = mk.map(k => { cum += months[k].p; return cum; });
  h += `<div class="card"><div class="card-h"><div class="card-t">월별 지출</div><span class="card-s"><span class="sw" style="display:inline-block;width:9px;height:9px;background:var(--primary);border-radius:2px"></span> 지급 <span style="display:inline-block;width:9px;height:9px;background:var(--primary-l);border-radius:2px;margin-left:6px"></span> 예정</span></div>
    <div class="vbars">${mk.map(k => { const o = months[k]; return `<div class="col"><div class="v">${fmtW(o.p + o.pl)}</div><i class="pl" style="height:${o.pl / mx * 100}%;border-radius:${o.p ? '5px 5px 0 0' : '5px 5px 0 0'}"></i><i style="height:${o.p / mx * 100}%;border-radius:${o.pl ? '0' : '5px 5px 0 0'}"></i><div class="x">${+k.slice(5)}월</div></div>`; }).join('')}</div>
    <div class="faint mt" style="font-size:12px">누적 지급: ${fmtW(cumTxt[cumTxt.length - 1] || 0)} (최근 ${mk.length}개월 기준)</div>
  </div>`;

  // 업체별
  const vs = {};
  DB.expense.forEach(e => { const k = e.vendorId || ''; vs[k] = (vs[k] || 0) + num(e.amount); });
  const vl = Object.entries(vs).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const vmx = Math.max(...vl.map(x => x[1]), 1);
  h += `<div class="card"><div class="card-t" style="margin-bottom:12px">업체별 지출 TOP</div>${vl.map(([id, v]) => `
    <div style="margin-bottom:10px;cursor:${id ? 'pointer' : 'default'}" ${id ? `onclick="openVendor('${id}')"` : ''}><div class="between" style="font-size:13px;margin-bottom:4px"><span class="ellipsis">${esc(id ? refName('vendor', id) : '(업체 미지정)')}</span><b class="num">${fmtW(v)}</b></div>
    <div class="bar"><i style="width:${v / vmx * 100}%;background:var(--accent)"></i></div></div>`).join('')}</div>`;

  // 결제수단
  const pm = {};
  DB.expense.forEach(e => { const k = e.payMethod || '미지정'; pm[k] = (pm[k] || 0) + num(e.amount); });
  h += `<div class="card"><div class="card-t" style="margin-bottom:8px">결제수단별</div><table class="tb">${Object.entries(pm).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="right num"><b>${fmtN(v)}원</b></td></tr>`).join('')}</table></div>`;
  return h;
}

function vPhase() {
  const ph = sortedPhases();

  let h = `<div class="card"><div class="between"><div><div class="card-t">전체 진행률</div><div class="card-s">${ph.filter(x => x.status === '완료').length}/${ph.length} 단계 완료</div></div><div style="font-size:28px;font-weight:800;color:var(--primary)">${prog.toFixed(0)}%</div></div>
    <div class="bar lg mt"><i style="width:${prog}%;background:var(--primary)"></i></div></div>`;
  if (!ph.length) return h + `<div class="card"><div class="empty"><div class="e">🏗️</div>공정을 등록해서 진행 상황을 관리하세요<br><button class="btn p sm mt" onclick="loadPhaseTemplate()">기본 공정 13단계 불러오기</button> <button class="btn sm mt" onclick="openForm('phase')">직접 추가</button></div></div>`;

  // 간트
  const dated = ph.filter(x => x.start && x.end && x.end >= x.start);
  if (dated.length) {
    const min = dated.reduce((m, x) => x.start < m ? x.start : m, dated[0].start);
    const max = dated.reduce((m, x) => x.end > m ? x.end : m, dated[0].end);
    const span = Math.max(1, daysBetween(min, max));
    const td = today(), tp = daysBetween(min, td) / span * 100;
    h += `<div class="card"><div class="card-t">일정표</div><div class="gantt">${dated.map(x => {
      const l = daysBetween(min, x.start) / span * 100, w = Math.max(1.5, (daysBetween(x.start, x.end) + 1) / span * 100);
      const pr = x.status === '완료' ? 100 : num(x.progress);
      return `<div class="gr" onclick="openPhase('${x.id}')" style="cursor:pointer"><div class="gn">${esc(x.name)}</div><div class="gt">${tp >= 0 && tp <= 100 ? `<span class="today" style="left:${tp}%"></span>` : ''}<span class="gb" style="left:${l}%;width:${Math.min(w, 100 - l)}%"><i style="width:${pr}%"></i></span></div></div>`;
    }).join('')}<div class="gx"><span></span><div class="between"><span>${fmtD(min)}</span><span>${fmtD(max)}</span></div></div></div></div>`;
  }

  h += `<div class="card"><div class="card-h"><div class="card-t">단계별</div><button class="btn sm p" onclick="openForm('phase',null,{order:${(ph.length ? Math.max(...ph.map(x => num(x.order))) : 0) + 1}})">＋ 공정</button></div><div class="list">` +
    ph.map(x => {
      const pr = x.status === '완료' ? 100 : Math.max(0, Math.min(100, num(x.progress)));
      const cost = DB.expense.filter(e => e.phaseId === x.id).reduce((s, e) => s + num(e.amount), 0);
      const nf = filesOf('phase', x.id).length;
      return `<div class="it" onclick="openPhase('${x.id}')" style="display:block">
        <div class="between"><div class="row"><b>${esc(x.name)}</b>${phaseBadge(x.status)}</div><span class="num muted" style="font-size:13px">${pr.toFixed(0)}%</span></div>
        <div class="bar" style="margin:8px 0 6px"><i style="width:${pr}%;background:${x.status === '완료' ? 'var(--green)' : 'var(--primary)'}"></i></div>
        <div class="between faint" style="font-size:12px"><span>${x.start || x.end ? fmtD(x.start) + ' ~ ' + fmtD(x.end) : '일정 미정'}</span><span>${cost ? '💰' + fmtW(cost) + ' ' : ''}${nf ? '📷' + nf : ''}</span></div>

      let data, thumb = '', mime = file.type || 'application/octet-stream', name = file.name;

        const img = await loadImg(file);
        data = resizeImg(img, 2000, 0.85);
        thumb = makeThumb(img);
        mime = 'image/jpeg';
        name = name.replace(/\.(heic|heif|png|webp|jpe?g)$/i, '') + '.jpg';
      } else {
        if (file.size > 25 * 1024 * 1024) { toast(`${file.name}: 25MB 초과 파일은 올릴 수 없어요`, 'err'); continue; }
        data = await readAsDataURL(file);
      }
      await IDB.set('blob:' + id, data);
      upsert('file', Object.assign({ id, name, mime, size: file.size, thumb, local: 1, linkType: UPL.preset.linkType || '', linkId: UPL.preset.linkId || '' }, vals));
    } catch (err) {
      console.error(err);
      toast(`${file.name} 처리 실패`, 'err');
    }
  }
  const ctx = UPL.preset;
  UPL = null;
  closeSheet();
  render();
  toast(`${n}개 저장했어요` + (CFG.gas ? ' — 드라이브에 업로드 중' : ''));
  if (ctx.linkType === 'expense') openExpense(ctx.linkId);
  else if (ctx.linkType === 'meeting') openMeeting(ctx.linkId);
  else if (ctx.phaseId && S.page !== 'photo') openPhase(ctx.phaseId);
}
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file);
    const i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); res(i); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('이미지를 읽을 수 없어요')); };
    i.src = u;
  });
}
function resizeImg(img, max, q) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function makeThumb(img) {
  // 구글 시트 셀 한도(5만자) 안에 들어가도록 썸네일 크기 조절
  let t = '';
  for (const [sz, q] of [[420, 0.65], [360, 0.55], [300, 0.5], [220, 0.45]]) {
    t = resizeImg(img, sz, q);
    if (t.length < 40000) return t;
  }
  return t;
}
const readAsDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

async function handleConnectLink() {
  const m = location.hash.match(/^#connect=(.+)$/);
  if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  let u = '';
  try { u = decodeURIComponent(m[1]).trim(); } catch (e) {}
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { toast('연결 링크가 올바르지 않아요', 'err'); return false; }
  if (CFG.gas === u) { toast('이미 연결된 기기예요'); return false; }
  if (CFG.gas && !confirm('다른 구글 시트에 연결돼 있어요. 새 링크로 바꿀까요?')) return false;
  CFG.gas = u; CFG.syncErr = 0;
  // 이 기기에 아직 올리지 않은 기록이 있으면 함께 올림
  if (!CFG.lastSync) COLS.forEach(c => DB[c].forEach(rec => PENDING.push({ op: 'upsert', col: c, rec })));

  toast('연결됐어요! 데이터를 불러오는 중…');
  await sync(true);
  return true;

    copyText(await r.text(), 'Apps Script 코드를 복사했어요');
  } catch (e) {
    toast('코드를 불러오지 못했어요 — 저장소의 Code.gs 파일을 사용하세요', 'err');
  }
}
function exportJSON() {
  download(`세컨하우스_백업_${today()}.json`, JSON.stringify({ app: 'second-house', ver: APP_VER, exported: new Date().toISOString(), data: DB }, null, 1), 'application/json');
}
document.getElementById('importPick').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const d = j.data || j;
    if (!COLS.some(c => Array.isArray(d[c]))) throw new Error('형식이 올바르지 않아요');
    if (!confirm('백업 파일로 이 기기 데이터를 교체할까요?' + (CFG.gas ? '\n(구글 시트에도 반영됩니다)' : ''))) return;
    COLS.forEach(c => { DB[c] = Array.isArray(d[c]) ? d[c].map(r => norm(c, r)) : []; DB[c].forEach(rec => PENDING.push({ op: 'upsert', col: c, rec })); });
    await persist(); scheduleFlush(); render(); toast('불러오기 완료');
  } catch (err) { toast('불러오기 실패: ' + err.message, 'err'); }
  e.target.value = '';
});
function exportCSV() {
  const head = ['날짜', '상태', '내용', '분류', '업체', '공정', '금액', '결제수단', '메모'];
  const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const rows = [...DB.expense].sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(e => [e.date, e.status, e.title, e.category, refName('vendor', e.vendorId), refName('phase', e.phaseId), num(e.amount), e.payMethod, e.memo].map(q).join(','));
  download(`세컨하우스_지출_${today()}.csv`, '﻿' + [head.map(q).join(','), ...rows].join('\n'), 'text/csv');
}
async function resetLocal() {
  if (!confirm('이 기기의 데이터를 모두 삭제할까요?' + (PENDING.length ? `\n⚠️ 아직 전송 안 된 변경 ${PENDING.length}건이 사라집니다` : ''))) return;
  await IDB.clear();
  COLS.forEach(c => DB[c] = []); PENDING = []; CFG = { gas: CFG.gas, lastSync: '' };
  await persist(); render(); toast('삭제했어요');
}

/* ═══════════════════ 폼 ═══════════════════ */
function fieldHtml(f, v) {
  const id = 'f_' + f.k;
  const lab = `<label for="${id}">${f.l}${f.req ? ' <span class="req">*</span>' : ''}</label>`;
  let inp;
  v = v == null ? '' : v;
  if (f.t === 'select' || f.t === 'ref') {
    const opts = f.t === 'ref' ? [['', '- 선택 안함 -'], ...refOpts(f.ref)] : (typeof f.opts === 'function' ? f.opts() : f.opts).map(o => [o, o || '-']);
    if (v && !opts.some(o => o[0] === v)) opts.push([v, f.t === 'ref' ? '(삭제됨)' : v]);
    inp = `<select id="${id}">${f.t === 'select' && !f.def && !opts.some(o => o[0] === '') ? '<option value="">- 선택 -</option>' : ''}${opts.map(([k, l]) => `<option value="${esc(k)}" ${String(v) === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  } else if (f.t === 'textarea') {
    inp = `<textarea id="${id}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  } else if (f.t === 'money') {
    inp = `<input id="${id}" class="money" inputmode="numeric" value="${v === '' ? '' : fmtN(v)}" placeholder="0" autocomplete="off"><div class="hint" id="${id}_h">${v !== '' && num(v) ? fmtW(v) : ''}</div>`;
  } else {
    const type = { number: 'number', date: 'date', time: 'time', tel: 'tel', email: 'email' }[f.t] || 'text';
    inp = `<input id="${id}" type="${type}" ${f.t === 'number' ? 'inputmode="decimal" step="any"' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
  }
  return `<div class="fld ${f.half ? 'half' : ''}">${lab}${inp}${f.hint ? `<div class="hint">${f.hint}</div>` : ''}</div>`;
}
function formFields(col, rec) {
  const fs = F[col];
  let h = '', i = 0;
  while (i < fs.length) {
    const f = fs[i];
    if (f.half && fs[i + 1] && fs[i + 1].half) {
      h += `<div class="frow">${fieldHtml(f, rec[f.k])}${fieldHtml(fs[i + 1], rec[fs[i + 1].k])}</div>`;
      i += 2;
    } else { h += fieldHtml(f, rec[f.k]); i++; }
  }
  return h;
}
function openForm(col, id, preset) {
  const exist = id ? byId(col, id) : null;
  const rec = exist ? Object.assign({}, exist) : Object.assign({}, preset || {});
  if (col === 'project' && !exist) rec.id = 'main';
  if (!exist) F[col].forEach(f => { if (rec[f.k] === undefined && f.def !== undefined) rec[f.k] = typeof f.def === 'function' ? f.def() : f.def; });
  if (col === 'expense' && !exist && !rec.category && rec.vendorId) {
    const last = DB.expense.filter(e => e.vendorId === rec.vendorId).sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
    if (last) rec.category = last.category;
  }
  const isNew = !exist;
  openSheet(`<div class="sheet-h"><h3>${TITLES[col]} ${isNew && col !== 'project' ? '추가' : '수정'}</h3>${!isNew && col !== 'project' ? `<button class="btn sm d" onclick="delRec('${col}','${id}')">삭제</button>` : ''}</div>
    ${formFields(col, rec)}
    ${col === 'meeting' && isNew ? `<label class="row" style="font-size:14px;margin-bottom:6px;cursor:pointer"><input type="checkbox" id="f__todo" checked style="width:18px;height:18px"> 액션아이템을 할일로 자동 등록</label>` : ''}
    <div class="sheet-btns"><button class="btn" onclick="closeSheet()">취소</button><button class="btn p" onclick="submitForm('${col}','${exist ? id : (rec.id || '')}',${isNew})">저장</button></div>`);
  if (col === 'expense' && isNew) {
    const v = document.getElementById('f_vendorId'), c = document.getElementById('f_category');
    if (v && c) v.addEventListener('change', () => {
      const vd = byId('vendor', v.value);
      const last = DB.expense.filter(e => e.vendorId === v.value).sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
      if (last && last.category) c.value = last.category;
      else if (vd && vd.field) { const guess = { '설계사무소': '설계·감리', '감리': '설계·감리', '토목': '토목·기초', '골조': '골조', '전기': '전기·통신', '설비': '설비(배관·냉난방)', '창호': '창호', '인테리어': '내장·마감', '조경': '조경·외부', '측량': '인허가·세금', '법무·세무': '인허가·세금', '금융': '금융비용', '공인중개': '토지' }[vd.field]; if (guess && !c.value) c.value = guess; }
    });
  }
  const first = document.querySelector('.sheet input:not([type=date]):not([type=checkbox]), .sheet textarea');
  if (first && window.innerWidth >= 1024) first.focus();
}
function readForm(col) {
  const o = {};
  F[col].forEach(f => {
    const el = document.getElementById('f_' + f.k);
    if (!el) return;
    let v = el.value.trim();
    if (f.t === 'money') v = v === '' ? '' : num(v);
    else if (f.t === 'number') v = v === '' ? '' : num(v);
    o[f.k] = v;
  });
  return o;
}
function submitForm(col, id, isNew) {
  const vals = readForm(col);
  const miss = F[col].filter(f => f.req && (vals[f.k] === '' || vals[f.k] == null));
  if (miss.length) { toast(miss.map(f => f.l).join(', ') + ' 을(를) 입력하세요', 'err'); document.getElementById('f_' + miss[0].k).focus(); return; }
  if (col === 'phase' && vals.start && vals.end && vals.end < vals.start) return toast('종료일이 시작일보다 빨라요', 'err');
  if (col === 'phase') { if (num(vals.progress) >= 100 && vals.status !== '보류') vals.status = '완료'; if (vals.status === '완료') vals.progress = 100; }
  const autoTodo = col === 'meeting' && isNew && document.getElementById('f__todo') && document.getElementById('f__todo').checked;
  const base = !isNew ? byId(col, id) || {} : (id ? { id } : {});
  const rec = upsert(col, Object.assign({}, base, vals));
  closeSheet();
  let msg = '저장했어요';
  if (autoTodo) { const n = actionsToTodos(rec.id, true); if (n) msg += ` · 할일 ${n}개 등록`; }
  render();
  toast(msg);
  if (col === 'meeting' && isNew) openMeeting(rec.id);
}
function delRec(col, id) {
  let warn = '';
  if (col === 'vendor') { const n = DB.expense.filter(e => e.vendorId === id).length; if (n) warn = `\n(연결된 지출 ${n}건은 남고 업체 표시만 사라집니다)`; }
  if (col === 'meeting') { const n = filesOf('meeting', id).length; if (n) warn = `\n(첨부 ${n}개는 사진·자료에 남습니다)`; }
  if (!confirm(`이 ${TITLES[col]}을(를) 삭제할까요?${warn}`)) return;
  removeRec(col, id);
  closeSheet(); render(); toast('삭제했어요');
}
function dlHtml(col, r, skip) {
  const rows = F[col].filter(f => !skip.includes(f.k) && r[f.k] !== '' && r[f.k] != null).map(f => {
    let v = r[f.k];
    if (f.t === 'money') v = `${fmtN(v)}원 <span class="faint">(${fmtW(v)})</span>`;
    else if (f.t === 'ref') { const n = refName(f.ref, v); v = n ? (f.ref === 'vendor' ? `<a href="#" onclick="event.preventDefault();openVendor('${v}')">${esc(n)}</a>` : f.ref === 'phase' ? `<a href="#" onclick="event.preventDefault();openPhase('${v}')">${esc(n)}</a>` : esc(n)) : '<span class="faint">(삭제됨)</span>'; }
    else if (f.t === 'date') v = `${fmtD(v)} (${dow(v)})`;
    else if (f.t === 'tel') v = `<a href="tel:${esc(v)}">${esc(v)}</a>`;
    else if (f.t === 'email') v = `<a href="mailto:${esc(v)}">${esc(v)}</a>`;
    else if (f.t === 'textarea') v = `<span class="pre">${esc(v)}</span>`;
    else if (/㎡/.test(f.l)) v = `${esc(v)}㎡ <span class="faint">(${(num(v) / PY).toFixed(1)}평)</span>`;
    else if (/%/.test(f.l)) v = `${esc(v)}%`;
    else v = esc(v);
    return `<dt>${f.l.replace(/\(.*\)/, '')}</dt><dd>${v}</dd>`;
  });
  return rows.length ? `<dl class="dl">${rows.join('')}</dl>` : '';
}

/* ═══════════════════ 시트/토스트 ═══════════════════ */
function openSheet(html) {
  document.getElementById('layer').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="grab"></div>${html}</div></div>`;
  document.body.style.overflow = 'hidden';
}
// 상세시트를 열어둔 상태에서 데이터가 바뀌면 다시 그림
const CTX = { last: null };
['openExpense', 'openMeeting', 'openVendor', 'openPhase'].forEach(fn => {
  const orig = window[fn];
  window[fn] = function (id) { CTX.last = [fn, id]; return orig(id); };
});
function refreshSheetCtx() {
  if (CTX.last && document.querySelector('.sheet')) { const [fn, id] = CTX.last; window[fn](id); }
}
function closeSheet() {
  document.getElementById('layer').innerHTML = '';
  document.body.style.overflow = '';
  CTX.last = null;
}
function openQuick() {
  openSheet(`<div class="sheet-h"><h3>무엇을 기록할까요?</h3></div>
    <div class="quick">
      <button onclick="openForm('expense')"><span>💰</span>지출</button>
      <button onclick="openUploader()"><span>📷</span>사진·자료</button>
      <button onclick="openForm('meeting')"><span>📝</span>미팅 기록</button>
      <button onclick="openForm('todo')"><span>✅</span>할일</button>
      <button onclick="openForm('vendor')"><span>🤝</span>업체</button>
      <button onclick="openForm('expense',null,{status:'지급예정'})"><span>🗓️</span>지급 예정</button>
    </div>`);
}
let toastTimer;
function toast(msg, type) {
  let el = document.getElementById('toast');
  if (el) el.remove();
  el = document.createElement('div');
  el.id = 'toast'; el.className = 'toast ' + (type || ''); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), type === 'err' ? 4000 : 2400);
}
function copyText(t, msg) {
  const done = () => toast(msg || '복사했어요');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('복사 실패', 'err'); } ta.remove(); }
}
function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('money')) return;
  const neg = t.value.trim().startsWith('-');
  const digits = t.value.replace(/[^0-9]/g, '');
  t.value = digits ? (neg ? '-' : '') + Number(digits).toLocaleString('ko-KR') : (neg ? '-' : '');
  const h = document.getElementById(t.id + '_h');
  if (h) h.textContent = digits ? fmtW((neg ? -1 : 1) * Number(digits)) : '';
});

/* ═══════════════════ 동기화 ═══════════════════ */
async function api(body) {
  const r = await fetch(CFG.gas, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('응답 형식 오류 (배포 설정의 액세스 권한을 "모든 사용자"로 했는지 확인)'); }
  if (j.error) throw new Error(j.error);
  return j;
}
function scheduleFlush() {
  setSyncDot();
  if (!CFG.gas) return;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(() => push().catch(() => {}), 1500);
}
function compactOps(ops) {
  const m = new Map();
  ops.forEach(o => { const k = o.col + ':' + (o.op === 'delete' ? o.id : o.rec.id); m.delete(k); m.set(k, o); });
  return [...m.values()];
}
async function flush() {
  if (!PENDING.length) return;
  const n = PENDING.length;
  const ops = compactOps(PENDING.slice(0, n));
  for (let i = 0; i < ops.length; i += 100) await api({ action: 'batch', ops: ops.slice(i, i + 100) });
  PENDING.splice(0, n);
  await persist();
}
async function uploadFiles() {
  const pend = DB.file.filter(f => f.local);
  for (const f of pend) {
    const data = await IDB.get('blob:' + f.id);
    if (!data) { upsert('file', Object.assign({}, f, { local: 0 })); continue; }
    const res = await api({ action: 'upload', name: `${f.date || today()}_${f.kind || '자료'}_${f.name || f.id}`, mime: f.mime, caption: f.caption || '', data: String(data).split(',')[1] });
    const cur = byId('file', f.id);
    if (cur) upsert('file', Object.assign({}, cur, { local: 0, driveId: res.id, url: res.url }));
  }
}
async function push() {
  if (!CFG.gas || SYNCING) return;
  SYNCING = true; setSyncDot('busy');
  try {
    await uploadFiles();
    await flush();
    CFG.syncErr = 0;
  } catch (e) {
    CFG.syncErr = 1; console.warn(e);
  } finally {
    SYNCING = false; setSyncDot(); persist();
    if (S.page === 'photo' && !document.querySelector('.sheet')) render();
  }
}
async function sync(manual) {
  if (!CFG.gas) { if (manual) { toast('설정에서 구글 시트를 연결하면 동기화돼요'); if (S.page !== 'settings') go('settings'); } return; }
  if (SYNCING) { if (manual) toast('동기화 중이에요'); return; }
  SYNCING = true; setSyncDot('busy');
  try {
    await uploadFiles();
    await flush();
    const j = await api({ action: 'readAll' });
    const localOnly = DB.file.filter(f => f.local);
    COLS.forEach(c => { if (Array.isArray(j.data && j.data[c])) DB[c] = j.data[c].map(r => norm(c, r)); });
    localOnly.forEach(f => { if (!byId('file', f.id)) DB.file.push(f); });
    const d = new Date();
    CFG.lastSync = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    CFG.syncErr = 0;
    await persist();
    if (manual) toast('동기화 완료');
  } catch (e) {
    CFG.syncErr = 1;
    if (manual) toast('동기화 실패: ' + e.message, 'err');
  } finally {
    SYNCING = false;
    if (!document.querySelector('.sheet')) render(); else setSyncDot();
  }
}

/* ═══════════════════ 시작 ═══════════════════ */
(async function init() {
  await loadState();
  render();
  if (!(await handleConnectLink()) && CFG.gas) sync(false);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && CFG.gas) sync(false); });
})();
</script>
